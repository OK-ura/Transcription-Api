<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcription API showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <div class="theme">
            <h1>Transcription Service</h1>
            <h2>Transcription API showcase page</h2>
            <p> 
                Press record and say something. After ending the recording, a request will 
                be made to the API. Once processed the transcription will be displayed below the audio preview. 
            </p>
            
            <button id="record">Record</button>
            
            <audio id="listenPV"controls src="temp.mp3"></audio>
            
            <div id="result"> Transcription will appear here. </div>
        </div>
    </div>

</body>
<script src="script.js"> </script>
</html>
